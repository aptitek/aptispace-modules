version: '3'

tasks:
  lint:
    desc: Check Quarto environment and lint all qmd files
    cmds:
      - python3 scripts/code-lint.py .
      - python3 scripts/quarto-lint.py .
      - quarto check

  render:
    desc: Render the full website
    cmds:
      - quarto render

  preview:
    desc: Start live preview server
    cmds:
      - quarto preview

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf _site .quarto
