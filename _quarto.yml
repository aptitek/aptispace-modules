project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!legacy/**"
  resources:
    - "assets/**"

filters:
  - timeline
  - live
  - aptitek/download-fonts
  - aptitek/cards
  - aptitek/tabs
  - aptitek/ojs-bridge
  - aptitek/ojs-inputs
  - aptitek/bi-icons
  - aptitek/embed
  - aptitek/grid

website:
  title: "Aptispace"
  search: false
  sidebar:
    style: "docked"
    search: false
    contents:
      - section: "🤖 Intelligence Artificielle"
        contents:
          - modules/ia/nlp.qmd
          - modules/ia/autocompletion.qmd
          - modules/ia/vae.qmd
          - modules/ia/injection-prompt.qmd
      - section: "📊 Data Science"
        contents:
          - modules/datascience/dataframe.qmd
          - modules/datascience/colonnaire.qmd
      - section: "🧮 Mathématiques"
        contents:
          - modules/maths/statistiques.qmd
      - section: "💻 Informatique"
        contents:
          - modules/informatique/histoire.qmd
          - modules/informatique/information.qmd
          - modules/informatique/données.qmd
      - section: "🏗️ Architecture"
        contents:
          - modules/architecture/memoires.qmd

format:
  html:
    theme:
      - theme/solarized/variables.scss
      - theme/solarized/base.scss
      - styles/components/index.scss
      - styles/simulators/index.scss
    toc: true
    code-copy: true
    echo: false
    ojs: true
    include-in-header:
      - text: '<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>'
      - text: |
          <script type="module">
            if (!window.aptitek) {
              const mod = await import("/assets/js/index.js");
              window.aptitek = Object.freeze({ ...mod });
            }
          </script>

